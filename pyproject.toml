[project]
name = "mcp-file-context"
version = "0.1.0"
description = "MCP server for reading .venv file contents"
authors = [
    {name = "Martin Smith", email = "msmith@bitmonster.org"}
]
dependencies = [
    "fastmcp>=0.3.0"
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
mcp-file-context = "mcp_file_context.server:main"

[project.entry-points."mcp.stdio_servers"]
mcp-file-context = "mcp_file_context.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_file_context = ["py.typed"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
